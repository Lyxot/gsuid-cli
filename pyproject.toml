[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsuid-cli"
version = "0.1.0"
description = "Agent-oriented CLI for Genshin Impact account and public data."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "AGPL-3.0-only"
authors = [{ name = "Lyxot" }]
dependencies = [
  "filelock>=3.13",
  "httpx[socks]>=0.28",
  "keyring>=25.0",
  "langcodes>=3.5,<4",
  "Pillow>=10,<13",
  "pyobjc-framework-cocoa>=12,<13 ; sys_platform == 'darwin'",
  "pyoxipng>=9.1,<10",
  "qrcode>=7.3,<8",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=4.0",
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
gsuid = "gsuid_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gsuid_cli = [
  "assets/ATTRIBUTION.md",
  "assets/challenge/abyss/textures/*.png",
  "assets/challenge/abyss/textures/*.jpg",
  "assets/challenge/hard/textures/*.jpg",
  "assets/challenge/hard/textures/*.png",
  "assets/challenge/theater/textures/*.png",
  "assets/daily/materials/textures/*.png",
  "assets/daily/note/textures/*.apng",
  "assets/daily/note/textures/*.png",
  "assets/announcements/textures/*.png",
  "assets/events/textures/*.png",
  "assets/gacha/data/*.json",
  "assets/gacha/textures/*.png",
  "assets/gacha/textures/*/*.png",
  "assets/guide/abyss/textures/*.png",
  "assets/guide/abyss/textures/bg/*.jpg",
  "assets/guide/theater/textures/*.png",
  "assets/misc/primogems/*.png",
  "assets/panel/data/*.json",
  "assets/panel/textures/*.jpg",
  "assets/panel/textures/*.png",
  "assets/panel/textures/fetter/*.png",
  "assets/panel/textures/graduation/*.png",
  "assets/panel/textures/icon/*.png",
  "assets/panel/textures/weapon_affix/*.png",
  "assets/player/characters/textures/*.png",
  "assets/player/characters/textures/hg/*.png",
  "assets/player/characters/textures/mz/*.png",
  "assets/player/calendar/textures/*.png",
  "assets/player/diary/textures/*.apng",
  "assets/player/diary/textures/*.jpg",
  "assets/player/diary/textures/*.png",
  "assets/player/inventory/textures/*.png",
  "assets/player/summary/textures/*.png",
  "assets/player/summary/textures/*.webp",
  "assets/progress/achievements/textures/*.png",
  "assets/progress/collection/textures/*.jpg",
  "assets/progress/collection/textures/*.png",
  "assets/progress/gcg/data/*.json",
  "assets/progress/gcg/textures/*.jpg",
  "assets/progress/gcg/textures/*.png",
  "assets/public/fonts/*.ttf",
  "assets/public/textures/*.jpg",
  "assets/public/textures/*.png",
  "assets/public/textures/char_card/*.png",
  "assets/public/textures/weapon/*.png",
  "assets/rank/textures/*.jpg",
  "assets/rank/textures/*.png",
  "assets/rerun/textures/*.png",
  "assets/wiki/textures/*.jpg",
  "assets/wiki/textures/*.png",
  "assets/wiki/textures/weapon_star/*.png",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
combine-as-imports = true
