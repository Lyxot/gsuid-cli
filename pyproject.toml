[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsuid-cli"
version = "0.1.0"
description = "Agent-oriented CLI for Genshin Impact account and public data."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "AGPL-3.0-only"
authors = [{ name = "Lyxot" }]
dependencies = [
  "filelock>=3.13",
  "httpx[socks]>=0.28",
  "keyring>=25.0",
  "Pillow>=10,<13",
  "qrcode>=7.3,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
gsuid = "gsuid_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gsuid_cli = [
  "assets/ATTRIBUTION.md",
  "assets/daily/materials/textures/*.png",
  "assets/daily/note/textures/*.apng",
  "assets/daily/note/textures/*.png",
  "assets/player/characters/textures/*.png",
  "assets/player/characters/textures/hg/*.png",
  "assets/player/characters/textures/mz/*.png",
  "assets/player/summary/textures/*.png",
  "assets/player/summary/textures/*.webp",
  "assets/public/fonts/*.ttf",
  "assets/public/textures/*.jpg",
  "assets/public/textures/*.png",
  "assets/public/textures/weapon/*.png",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
