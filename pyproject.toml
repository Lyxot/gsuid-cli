[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsuid-cli"
version = "0.1.0"
description = "Agent-oriented CLI for Genshin Impact account and public data."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "AGPL-3.0-only"
authors = [{ name = "Lyxot" }]
dependencies = [
  "httpx>=0.28",
  "keyring>=25.0",
  "qrcode[pil]>=7.3,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
gsuid = "gsuid_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
