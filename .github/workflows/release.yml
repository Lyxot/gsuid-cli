name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.19"
          python-version: "3.11"
      - name: Build distributions
        run: uv build --python 3.11
      - uses: actions/upload-artifact@v7
        with:
          name: gsuid-cli-dist
          path: dist/*
